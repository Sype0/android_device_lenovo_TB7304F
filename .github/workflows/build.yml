# Builds LineageOS 15.1 for the Lenovo TB-7304F, in up to three stages
name: Build LineageOS

on:
  push:
    branches: [lineage-15.1]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  stage1:
    uses: ./.github/workflows/stage.yml
    with:
      stage: 1

  stage2:
    needs: stage1
    if: needs.stage1.outputs.done == 'false'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 2

  stage3:
    needs: stage2
    if: needs.stage2.outputs.done == 'false'
    uses: ./.github/workflows/stage.yml
    with:
      stage: 3
